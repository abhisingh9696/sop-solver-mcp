[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sop-solver-mcp"
version = "0.1.0"
description = "Standalone Sales & Operations Planning server — LP engines + Jev gate (extracted from the Wooden Space solve)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "mcp>=1.2",
]

[project.scripts]
sop-solver = "sop_solver.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sop_solver"]
